<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>속담 퀴즈</title>
  <meta name="description" content="초등학생을 위한 한국 속담 4지선다 퀴즈" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="속담퀴즈" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff; --bg2: #f5f5f0; --bg3: #eeede8;
      --text: #1a1a1a; --text2: #666; --text3: #999;
      --border: rgba(0,0,0,0.12); --border2: rgba(0,0,0,0.22);
      --radius: 14px; --radius-sm: 9px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e; --bg2: #2c2c2e; --bg3: #3a3a3c;
        --text: #f0f0f0; --text2: #aaa; --text3: #666;
        --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.22);
      }
    }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); }
    body { display: flex; flex-direction: column; min-height: 100dvh; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 1.5rem 1rem 3rem; width: 100%; flex: 1; }

    .screen { display: none; }
    .screen.active { display: block; }

    /* 메인 화면 */
    .main-header { text-align: center; padding: 1.25rem 0 2rem; }
    .main-emoji { font-size: 60px; display: block; margin-bottom: 10px; }
    .main-title { font-size: 32px; font-weight: 800; letter-spacing: -1px; }
    .main-sub { font-size: 15px; color: var(--text2); margin-top: 8px; }

    .level-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 1.5rem; }
    .level-card { border-radius: var(--radius); border: 2px solid var(--border); padding: 1.25rem 0.5rem; text-align: center; cursor: pointer; background: var(--bg); transition: transform .1s; -webkit-tap-highlight-color: transparent; user-select: none; }
    .level-card:active { transform: scale(0.93); }
    .lv-icon { font-size: 36px; display: block; margin-bottom: 8px; }
    .lv-name { font-size: 17px; font-weight: 800; margin-bottom: 4px; }
    .lv-desc { font-size: 11px; color: var(--text2); line-height: 1.55; }
    .lv-count { font-size: 11px; margin-top: 6px; font-weight: 600; opacity: .7; }
    .lv-easy { border-color: #97C459; } .lv-easy .lv-name { color: #3B6D11; }
    .lv-mid  { border-color: #85B7EB; } .lv-mid  .lv-name { color: #185FA5; }
    .lv-hard { border-color: #ED93B1; } .lv-hard .lv-name { color: #993556; }
    @media (prefers-color-scheme: dark) {
      .lv-easy .lv-name { color: #97C459; }
      .lv-mid  .lv-name { color: #85B7EB; }
      .lv-hard .lv-name { color: #ED93B1; }
    }

    .owl-box { background: var(--bg2); border-radius: var(--radius); padding: 1rem 1.25rem; display: flex; align-items: center; gap: 12px; }
    .owl-icon { font-size: 30px; flex-shrink: 0; }
    .owl-text { font-size: 13px; color: var(--text2); line-height: 1.7; }

    /* 퀴즈 화면 */
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
    .back-btn { font-size: 13px; color: var(--text2); cursor: pointer; border: none; background: none; padding: 6px 10px; border-radius: var(--radius-sm); -webkit-tap-highlight-color: transparent; }
    .back-btn:active { background: var(--bg2); }
    .level-pill { font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 99px; }
    .pill-easy { background: #EAF3DE; color: #27500A; }
    .pill-mid  { background: #E6F1FB; color: #0C447C; }
    .pill-hard { background: #FBEAF0; color: #72243E; }
    @media (prefers-color-scheme: dark) {
      .pill-easy { background: #1a2e0f; color: #C0DD97; }
      .pill-mid  { background: #0d1e35; color: #B5D4F4; }
      .pill-hard { background: #2e0f1a; color: #F4C0D1; }
    }
    .score-txt { font-size: 13px; color: var(--text2); }
    .score-num { font-weight: 800; color: var(--text); }

    .progress-bar { height: 6px; background: var(--bg3); border-radius: 99px; margin-bottom: 1.25rem; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 99px; background: #97C459; transition: width .4s ease; }
    .pill-mid ~ .progress-fill, .pill-mid  { }

    .qnum-line { text-align: center; font-size: 13px; color: var(--text3); margin-bottom: 12px; }

    .proverb-card { border-radius: var(--radius); padding: 1.6rem 1.25rem; margin-bottom: 1.25rem; text-align: center; }
    .proverb-card.easy { background: #EAF3DE; }
    .proverb-card.mid  { background: #E6F1FB; }
    .proverb-card.hard { background: #FBEAF0; }
    @media (prefers-color-scheme: dark) {
      .proverb-card.easy { background: #1a2e0f; }
      .proverb-card.mid  { background: #0d1e35; }
      .proverb-card.hard { background: #2e0f1a; }
    }
    .proverb-main { font-size: 21px; font-weight: 800; color: var(--text); margin-bottom: 8px; line-height: 1.45; }
    .proverb-sub  { font-size: 13px; color: var(--text2); }

    .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1.25rem; }
    .opt { border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 0.9rem 0.85rem; font-size: 14px; color: var(--text); cursor: pointer; background: var(--bg); text-align: left; line-height: 1.5; transition: transform .08s; -webkit-tap-highlight-color: transparent; font-family: inherit; }
    .opt:active:not(:disabled) { transform: scale(0.95); }
    .opt.correct { background: #EAF3DE; border-color: #639922; color: #27500A; font-weight: 700; }
    .opt.wrong   { background: #FCEBEB; border-color: #E24B4A; color: #791F1F; }
    .opt:disabled { cursor: default; }
    @media (prefers-color-scheme: dark) {
      .opt.correct { background: #1a2e0f; border-color: #639922; color: #C0DD97; }
      .opt.wrong   { background: #2e0f0f; border-color: #E24B4A; color: #F09595; }
    }

    .explain-box { border-radius: var(--radius); border: 1.5px solid var(--border); padding: 1.1rem 1.25rem; margin-bottom: 1rem; background: var(--bg); display: none; }
    .explain-box.show { display: block; }
    .explain-lbl { font-size: 13px; font-weight: 700; color: var(--text2); margin-bottom: 8px; }
    .explain-text { font-size: 14px; color: var(--text); line-height: 1.85; }
    .explain-ex { font-size: 13px; color: var(--text2); margin-top: 8px; line-height: 1.7; padding-top: 8px; border-top: 1px solid var(--border); }
    .stars { font-size: 20px; letter-spacing: 3px; margin-bottom: 8px; }

    .feedback-line { text-align: center; font-size: 15px; font-weight: 700; min-height: 1.5rem; margin-bottom: 0.75rem; }
    .fb-ok { color: #3B6D11; } .fb-no { color: #A32D2D; }
    @media (prefers-color-scheme: dark) { .fb-ok { color: #97C459; } .fb-no { color: #F09595; } }

    .next-btn { width: 100%; padding: 0.9rem; border-radius: var(--radius-sm); border: 1.5px solid var(--border2); background: var(--bg); font-size: 16px; font-weight: 700; color: var(--text); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform .08s; font-family: inherit; }
    .next-btn:active { transform: scale(0.97); background: var(--bg2); }

    /* 결과 화면 */
    .result-header { text-align: center; padding: 2rem 0 1.5rem; }
    .result-emoji { font-size: 64px; display: block; margin-bottom: 12px; }
    .result-title { font-size: 26px; font-weight: 800; }
    .result-sub { font-size: 15px; color: var(--text2); margin-top: 6px; }
    .result-score-box { background: var(--bg2); border-radius: var(--radius); padding: 1.5rem; text-align: center; margin-bottom: 1.5rem; }
    .result-score-num { font-size: 56px; font-weight: 800; line-height: 1; }
    .result-score-label { font-size: 14px; color: var(--text2); margin-top: 6px; }
    .result-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .result-btn { padding: 0.9rem; border-radius: var(--radius-sm); border: 1.5px solid var(--border2); background: var(--bg); font-size: 15px; font-weight: 700; color: var(--text); cursor: pointer; -webkit-tap-highlight-color: transparent; font-family: inherit; }
    .result-btn:active { background: var(--bg2); transform: scale(0.97); }

    /* 설치 배너 */
    .install-bar { display: none; align-items: center; background: #EAF3DE; border-radius: var(--radius-sm); padding: 0.75rem 1rem; margin-bottom: 1rem; gap: 10px; }
    .install-bar.show { display: flex; }
    .install-bar-text { font-size: 13px; color: #27500A; flex: 1; line-height: 1.4; }
    .install-bar-btn { font-size: 13px; font-weight: 700; color: #27500A; background: none; border: 1.5px solid #639922; border-radius: 99px; padding: 4px 14px; cursor: pointer; white-space: nowrap; font-family: inherit; }
    .install-bar-close { font-size: 20px; color: #3B6D11; cursor: pointer; background: none; border: none; padding: 0 2px; line-height: 1; }
  </style>
</head>
<body>
<div class="wrap">

  <div id="installBar" class="install-bar">
    <span class="install-bar-text">📲 홈 화면에 추가하면 앱처럼 써요!</span>
    <button class="install-bar-btn" id="installBtn">설치</button>
    <button class="install-bar-close" id="installClose">×</button>
  </div>

  <!-- 메인 -->
  <div class="screen active" id="mainScreen">
    <div class="main-header">
      <span class="main-emoji">📖</span>
      <div class="main-title">속담 퀴즈!</div>
      <div class="main-sub">레벨을 골라봐요</div>
    </div>
    <div class="level-grid">
      <div class="level-card lv-easy" onclick="playClick();startQuiz('easy')">
        <span class="lv-icon">🌱</span>
        <div class="lv-name">초급</div>
        <div class="lv-desc">쉬운 속담으로<br>시작해요!</div>
        <div class="lv-count" style="color:#3B6D11;">20문제</div>
      </div>
      <div class="level-card lv-mid" onclick="playClick();startQuiz('mid')">
        <span class="lv-icon">⭐</span>
        <div class="lv-name">중급</div>
        <div class="lv-desc">조금 더<br>어려운 속담!</div>
        <div class="lv-count" style="color:#185FA5;">20문제</div>
      </div>
      <div class="level-card lv-hard" onclick="playClick();startQuiz('hard')">
        <span class="lv-icon">🔥</span>
        <div class="lv-name">고급</div>
        <div class="lv-desc">속담 왕에<br>도전해요!</div>
        <div class="lv-count" style="color:#993556;">20문제</div>
      </div>
    </div>
    <div class="owl-box">
      <span class="owl-icon">🦉</span>
      <div class="owl-text">속담을 알면 말이 더 재미있어져요!<br>레벨을 골라서 도전해봐요~ 파이팅!</div>
    </div>
  </div>

  <!-- 퀴즈 -->
  <div class="screen" id="quizScreen">
    <div class="topbar">
      <button class="back-btn" onclick="playBack();goMain()">← 처음으로</button>
      <span class="level-pill" id="levelPill"></span>
      <span class="score-txt">점수 <span class="score-num" id="scoreNum">0</span></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="qnum-line" id="qNumLine">문제 1 / 10</div>
    <div id="quizArea"></div>
    <div class="explain-box" id="explainBox">
      <div class="explain-lbl">💡 속담 풀이</div>
      <div id="explainContent"></div>
    </div>
    <div class="feedback-line" id="feedbackLine"></div>
    <div id="nextWrap" style="display:none;">
      <button class="next-btn" id="nextBtn">다음 문제 →</button>
    </div>
  </div>

  <!-- 결과 -->
  <div class="screen" id="resultScreen">
    <div class="result-header">
      <span class="result-emoji" id="resultEmoji">🎉</span>
      <div class="result-title" id="resultTitle">퀴즈 완료!</div>
      <div class="result-sub" id="resultSub"></div>
    </div>
    <div class="result-score-box">
      <div class="result-score-num" id="resultScore"></div>
      <div class="result-score-label" id="resultLabel"></div>
    </div>
    <div class="result-btns">
      <button class="result-btn" onclick="playClick();startQuiz(currentLevel)">같은 레벨 다시</button>
      <button class="result-btn" onclick="playClick();goMain()">레벨 바꾸기</button>
    </div>
  </div>

</div>
<script>
// ===================== 속담 데이터 =====================
const PROVERBS = {
  easy: [
    { p:"가는 말이 고와야 오는 말이 곱다", a:"남에게 잘해야 나도 잘 대접받는다", w:["빨리 가면 좋은 일이 생긴다","말을 많이 해야 친해진다","걸음이 빠를수록 좋다"], ex:"친구에게 먼저 친절하게 말하면, 친구도 나에게 친절하게 말해줘요.", desc:"내가 남에게 좋게 대하면, 남도 나에게 좋게 대한다는 뜻이에요. 먼저 친절하게 행동하는 게 중요해요!" },
    { p:"세 살 버릇 여든까지 간다", a:"어릴 때 버릇이 평생 간다", w:["세 살이 되면 어른이 된다","여든 살이 되면 지혜롭다","나이가 들면 버릇이 없어진다"], ex:"어릴 때부터 인사하는 습관을 들이면, 어른이 되어서도 인사를 잘 한답니다.", desc:"어릴 때 생긴 나쁜 버릇은 나이가 들어도 고치기 어려워요. 그래서 어릴 때부터 좋은 습관을 만드는 게 중요해요!" },
    { p:"백지장도 맞들면 낫다", a:"힘을 합치면 쉬워진다", w:["종이는 혼자 들어야 한다","백 장을 모으면 무거워진다","종이가 많으면 공부를 잘 한다"], ex:"무거운 책상을 혼자 들기 힘들 때, 친구와 같이 들면 훨씬 쉬워지잖아요!", desc:"아무리 가벼운 종이라도 함께 들면 더 쉽다는 뜻이에요. 혼자 하는 것보다 함께 하면 뭐든 더 잘 돼요!" },
    { p:"하늘이 무너져도 솟아날 구멍이 있다", a:"아무리 힘들어도 방법이 있다", w:["하늘이 무너지면 도망가야 한다","구멍이 크면 위험하다","하늘은 절대 무너지지 않는다"], ex:"시험을 망쳤다고 너무 슬퍼하지 마요. 다음에 더 열심히 하면 돼요!", desc:"아무리 어렵고 힘든 일이 생겨도 반드시 해결할 방법이 있다는 뜻이에요. 포기하지 말아요!" },
    { p:"낮말은 새가 듣고 밤말은 쥐가 듣는다", a:"말은 항상 조심해야 한다", w:["새와 쥐는 말을 잘 한다","낮에는 크게 말하면 안 된다","밤에는 쥐가 무서워진다"], ex:"친구 뒤에서 나쁜 말을 하면 그 말이 친구 귀에 들어갈 수 있어요.", desc:"어디서 하는 말이든 다 들릴 수 있으니 항상 말을 조심해야 해요. 나쁜 말은 하지 말아요!" },
    { p:"돌다리도 두드려보고 건너라", a:"무슨 일이든 신중하게 해라", w:["돌다리는 건너면 안 된다","두드리면 다리가 부서진다","돌을 던지고 건너가라"], ex:"숙제 제출 전에 틀린 곳이 없는지 한번 더 확인하는 것처럼요!", desc:"아무리 안전해 보이는 일도 미리 확인하고 조심하라는 뜻이에요. 실수를 줄이려면 꼼꼼히 확인해요!" },
    { p:"콩 심은 데 콩 나고 팥 심은 데 팥 난다", a:"한 일에 따라 결과가 달라진다", w:["콩과 팥은 같이 자란다","씨앗은 아무데나 심어도 된다","콩이 팥보다 맛있다"], ex:"열심히 공부하면 좋은 점수를 받고, 놀기만 하면 성적이 떨어지는 것처럼요.", desc:"좋은 씨앗을 심어야 좋은 열매가 나는 것처럼, 좋은 행동을 해야 좋은 결과가 온다는 뜻이에요!" },
    { p:"빈 수레가 요란하다", a:"아는 게 없을수록 떠든다", w:["수레는 항상 시끄럽다","빈 것이 더 가볍다","수레가 많으면 소리가 크다"], ex:"실제로 잘 모르면서 아는 척하며 큰소리치는 친구를 본 적 있죠?", desc:"내용이 없는 빈 수레가 더 시끄럽듯이, 아는 것이 적은 사람이 오히려 더 큰소리를 낸다는 뜻이에요!" },
    { p:"원숭이도 나무에서 떨어진다", a:"누구나 실수할 수 있다", w:["원숭이는 나무를 잘 탄다","나무가 높으면 위험하다","원숭이는 나무에 살지 않는다"], ex:"수학을 제일 잘하는 친구도 가끔 계산 실수를 해요. 누구나 그럴 수 있어요!", desc:"아무리 잘하는 사람도 실수할 때가 있어요. 실수해도 괜찮아요, 다시 잘하면 돼요!" },
    { p:"가재는 게 편이다", a:"비슷한 것끼리 서로 돕는다", w:["가재와 게는 싸운다","바다에 사는 것들은 다 같다","가재는 혼자 산다"], ex:"같은 반 친구들끼리 서로 도와주는 것처럼요.", desc:"가재와 게는 비슷하게 생겨서 서로 편을 들어준다는 뜻이에요. 비슷한 처지의 사람끼리 서로 돕는다는 말이에요!" },
    { p:"시작이 반이다", a:"일을 시작하는 게 가장 중요하다", w:["반만 해도 끝난다","시작하면 실패한다","반쪽만 해도 된다"], ex:"숙제가 너무 많아 보여도 일단 시작하면 금방 끝날 때가 있죠?", desc:"무슨 일이든 시작하기가 제일 어려워요. 일단 시작하면 절반은 한 거나 마찬가지예요!" },
    { p:"우물 안 개구리", a:"세상을 모르고 자기만 잘난 줄 안다", w:["개구리는 수영을 잘 한다","우물은 깊고 좁다","개구리는 우물을 좋아한다"], ex:"우리 동네만 알고 넓은 세상을 모르는 것처럼, 견문을 넓혀야 해요.", desc:"우물 안에서만 살면 넓은 세상을 모르듯이, 자기 주변만 보고 세상이 그것뿐이라고 착각하는 사람을 뜻해요!" },

const TOTAL_Q = 10;
let level='easy', score=0, qNum=0, answered=false;
let currentLevel='easy', usedIdx=[], queue=[];
let audioCtx=null, deferredPrompt=null;

function getCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function playTone(type,f1,f2,dur,vol){
  try{const c=getCtx(),o=c.createOscillator(),g=c.createGain();
  o.connect(g);g.connect(c.destination);o.type=type;
  o.frequency.setValueAtTime(f1,c.currentTime);
  if(f2)o.frequency.linearRampToValueAtTime(f2,c.currentTime+dur);
  g.gain.setValueAtTime(vol,c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
  o.start(c.currentTime);o.stop(c.currentTime+dur);}catch(e){}
}
function playChord(ns,dur,vol){ns.forEach(f=>playTone('sine',f,null,dur,vol));}
function playClick(){playTone('sine',880,1100,0.12,0.15);}
function playBack(){playTone('sine',600,400,0.15,0.12);}
function playCorrect(){[0,0.13,0.28].forEach((t,i)=>{const f=[[523,659],[659,784],[784,1047]];setTimeout(()=>playChord(f[i],0.22,0.13),t*1000);});}
function playWrong(){playTone('sawtooth',220,150,0.3,0.13);setTimeout(()=>playTone('sawtooth',180,120,0.25,0.1),150);}
function playNext(){playTone('sine',660,880,0.18,0.13);}
function playLvSelect(){[0,100,200].forEach((t,i)=>setTimeout(()=>playTone('sine',[440,550,660][i],null,0.15,0.13),t));}
function playResult(good){if(good){[0,0.15,0.3,0.45].forEach((t,i)=>{const f=[[523,659],[659,784],[784,1047],[1047,1319]];setTimeout(()=>playChord(f[i],0.25,0.12),t*1000);});}else{playTone('sine',440,330,0.4,0.12);}}

const lvMeta={
  easy:{label:'🌱 초급',pill:'pill-easy',card:'easy',bar:'#97C459'},
  mid: {label:'⭐ 중급',pill:'pill-mid', card:'mid', bar:'#85B7EB'},
  hard:{label:'🔥 고급',pill:'pill-hard',card:'hard',bar:'#ED93B1'}
};

function show(id){['mainScreen','quizScreen','resultScreen'].forEach(s=>document.getElementById(s).classList.remove('active'));document.getElementById(id).classList.add('active');}

function goMain(){show('mainScreen');score=0;qNum=0;}

function startQuiz(lv){
  level=lv;currentLevel=lv;score=0;qNum=0;answered=false;
  usedIdx=[];
  // 20문제 중 10개 랜덤 뽑기
  const pool=PROVERBS[lv];
  const idxArr=[...Array(pool.length).keys()];
  for(let i=idxArr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idxArr[i],idxArr[j]]=[idxArr[j],idxArr[i]];}
  queue=idxArr.slice(0,TOTAL_Q);

  playLvSelect();
  const m=lvMeta[lv];
  const pill=document.getElementById('levelPill');
  pill.textContent=m.label; pill.className='level-pill '+m.pill;
  document.getElementById('progressFill').style.background=m.bar;
  document.getElementById('scoreNum').textContent='0';
  show('quizScreen');
  nextQuestion();
}

function nextQuestion(){
  if(qNum>=TOTAL_Q){showResult();return;}
  answered=false;
  const data=PROVERBS[level][queue[qNum]];
  qNum++;
  document.getElementById('qNumLine').textContent=`문제 ${qNum} / ${TOTAL_Q}`;
  document.getElementById('progressFill').style.width=`${((qNum-1)/TOTAL_Q)*100}%`;
  document.getElementById('explainBox').classList.remove('show');
  document.getElementById('feedbackLine').textContent='';
  document.getElementById('nextWrap').style.display='none';
  const opts=shuffle([data.a,...data.w]);
  const m=lvMeta[level];
  document.getElementById('quizArea').innerHTML=`
    <div class="proverb-card ${m.card}">
      <div class="proverb-main">${data.p}</div>
      <div class="proverb-sub">이 속담의 뜻은 무엇일까요?</div>
    </div>
    <div class="opts">${opts.map(o=>`<button class="opt" data-val="${encodeURIComponent(o)}" data-ans="${encodeURIComponent(data.a)}" data-idx="${queue[qNum-1]}" onclick="choose(this)">${o}</button>`).join('')}</div>`;
}

function choose(btn){
  if(answered)return; answered=true;
  playClick();
  const ans=decodeURIComponent(btn.dataset.ans);
  const chosen=decodeURIComponent(btn.dataset.val);
  const idx=parseInt(btn.dataset.idx);
  const data=PROVERBS[level][idx];
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(decodeURIComponent(b.dataset.val)===ans)b.classList.add('correct');});
  const fb=document.getElementById('feedbackLine');
  if(chosen===ans){
    btn.classList.add('correct'); score++;
    document.getElementById('scoreNum').textContent=score;
    fb.innerHTML='<span class="fb-ok">🎉 정답이에요! 대단해요!</span>';
    playCorrect();
  }else{
    btn.classList.add('wrong');
    fb.innerHTML='<span class="fb-no">🙁 아쉬워요! 정답을 확인해봐요.</span>';
    playWrong();
  }
  // 풀이 표시
  const box=document.getElementById('explainBox'),content=document.getElementById('explainContent');
  box.classList.add('show');
  const stars=chosen===ans?'<div class="stars">⭐⭐⭐</div>':'';
  content.innerHTML=`${stars}<div class="explain-text">${data.desc}</div><div class="explain-ex">📌 예시: ${data.ex}</div>`;

  document.getElementById('nextWrap').style.display='block';
  const nb=document.getElementById('nextBtn');
  const isLast=(qNum>=TOTAL_Q);
  nb.textContent=isLast?'결과 보기 🎊':'다음 문제 →';
  nb.onclick=()=>{playNext(); isLast?showResult():nextQuestion();};
}

function showResult(){
  document.getElementById('progressFill').style.width='100%';
  const pct=Math.round((score/TOTAL_Q)*100);
  let emoji='😢',title='다음엔 더 잘 할 수 있어요!',sub='';
  if(pct>=90){emoji='🏆';title='속담 왕이에요!';}
  else if(pct>=70){emoji='🎉';title='정말 잘했어요!';}
  else if(pct>=50){emoji='😊';title='잘 했어요!';}
  sub=`${TOTAL_Q}문제 중 ${score}개 정답 (${pct}%)`;
  document.getElementById('resultEmoji').textContent=emoji;
  document.getElementById('resultTitle').textContent=title;
  document.getElementById('resultSub').textContent=sub;
  document.getElementById('resultScore').textContent=`${score}/${TOTAL_Q}`;
  document.getElementById('resultLabel').textContent=`정답률 ${pct}%`;
  playResult(pct>=70);
  show('resultScreen');
}

function shuffle(arr){return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]);}

if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBar').classList.add('show');});
document.getElementById('installBtn').onclick=()=>{playClick();if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null;document.getElementById('installBar').classList.remove('show');});}};
document.getElementById('installClose').onclick=()=>document.getElementById('installBar').classList.remove('show');
</script>
